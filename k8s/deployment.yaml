apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudpulse
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cloudpulse
  template:
    metadata:
      labels:
        app: cloudpulse
    spec:
      containers:
        - name: cloudpulse
          image: muhammed662/cloudpulse-app:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 5000
          env:
            - name: APP_VERSION
              value: "latest"
